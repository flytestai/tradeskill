# ============================================================================
# fail2ban filter：匹配 SSH 加固后的攻击形态
#
# 安装位置：/etc/fail2ban/filter.d/sshd-closed.conf
# 配套 jail：scripts/deploy/fail2ban-jail.local 的 [sshd-closed]
#
# 为什么需要（2026-09-19 实测）
# ---------------------------------------------------------------------------
#   SSH 加固（禁用密码、仅公钥）后，攻击者的行为形态变了：
#     加固前 → "Failed password for root from <ip>"
#              内置 sshd filter 能匹配 → 会被封
#     加固后 → "Connection closed by authenticating user root <ip> port N [preauth]"
#              客户端连接后发现只支持公钥，立即断开
#              → **该行不被任何内置模式计入**
#
#   实测证据：内置 filter 的全部模式对该行均为 0 matched
#     mode=normal / ddos / extra / aggressive → 全部 0 matched
#     （mdre-aggressive 只增加了 "Did not receive identification string"）
#   后果：持续攻击者从未被封：
#     108.165.164.23  出现 3510 次   封禁=否
#     92.118.39.77    出现  434 次   封禁=否
#
# ⚠️ 编写本 filter 时踩过的两个坑（都属"配了但没生效"）
# ---------------------------------------------------------------------------
#   坑 1：双重转义
#     先用 Python 生成配置，把 \S \d 写成了 \S \d，
#     落到文件里成了**字面反斜杠** → 正则永远匹配不上。
#     而 jail 仍显示 active、只有 `Total failed: 0` 暴露了问题。
#   坑 2：误以为内置 aggressive 能覆盖
#     `fail2ban-regex /var/log/auth.log 'sshd[mode=aggressive]'` 显示
#     175784 matched —— 但那是匹配了**别的行**（Failed password 等）。
#     只用单行测试才发现该形态 0 matched。
#
#   → 结论：**必须用"单行 + 目标日志行"验证**，而不是看整体匹配数或 jail 是否加载。
#
# 验证方法（必须看到 1 matched）
# ---------------------------------------------------------------------------
#   grep 'Connection closed by authenticating' /var/log/auth.log | tail -1 > /tmp/_one.log
#   fail2ban-regex /tmp/_one.log /etc/fail2ban/filter.d/sshd-closed.conf
#   → 应显示 "Lines: 1 lines, 0 ignored, 1 matched, 0 missed"
#
# 端到端验证（2026-09-19 已通过）
# ---------------------------------------------------------------------------
#   注入 10 条已知行 → sshd-closed 的 Total failed 增加 → IP 被封
#   → iptables 出现 REJECT 规则
# ============================================================================
[Definition]

failregex = ^.*Connection closed by authenticating user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*Connection closed by invalid user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*Connection reset by authenticating user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*Disconnected from authenticating user \S+ <HOST> port \d+(?: \[preauth\])?\s*$
            ^.*error: maximum authentication attempts exceeded for \S+ from <HOST>

ignoreregex =
