# ============================================================================
# KOL Skills Platform —— skill.flytest.com.cn 反向代理
#
# ⚠️ 隔离原则：本文件是**独立配置文件**，不修改现有 sites-enabled/flytest
#    与 sites-enabled/cliproxy。移除本文件即可完全回滚。
#
# 安装位置：/etc/nginx/sites-available/skill-platform
# 启用方式：ln -s /etc/nginx/sites-available/skill-platform /etc/nginx/sites-enabled/
#
# 上游服务（Docker，仅绑本机）：
#   REST : 127.0.0.1:8020   (kolplatform-rest)
#   MCP  : 127.0.0.1:8021   (kolplatform-mcp)
#
# 路由约定：
#   /mcp*     → MCP 服务（Agent 原生接入，需流式/长连接）
#   /         → REST API（含 /healthz、/api/v1/*）
# ============================================================================

# ---------------------------------------------------------------------------
# 80 端口：ACME 验证 + 301 跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name skill.flytest.com.cn;

    # Let's Encrypt HTTP-01 验证（证书申请/续期必需）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/flytest;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443 端口：HTTPS 反代
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name skill.flytest.com.cn;

    ssl_certificate     /etc/letsencrypt/live/skill.flytest.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skill.flytest.com.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 平台响应体不大，但 MCP 可能返回较长内容
    client_max_body_size 20m;

    # 不暴露服务器版本
    server_tokens off;

    # -----------------------------------------------------------------------
    # MCP 端点：streamable-http
    #   必须关闭 proxy_buffering 并放宽超时 —— MCP 使用 SSE 流式响应，
    #   缓冲会导致客户端收不到分块数据、连接被挂起。
    #
    # 🔒 鉴权协作（2026-09-19 新增，配套 api/mcp_server.RequireAuthMiddleware）
    #   实测历史问题：该端点**完全不校验凭据**（无 Key / 伪造 Key 均 200），
    #   而 REST 同容器无 Key 返回 401 —— 同一服务两套标准。
    #
    #   分工：
    #     · Nginx（本段）：把 X-Forwarded-For **覆盖**为真实客户端 IP
    #     · 应用层：按 XFF 首段判定来源，公网必须带有效 Key，内网放行
    #
    #   ⚠️ 必须是「覆盖」而不是 $proxy_add_x_forwarded_for「追加」：
    #      追加写法 = "$http_x_forwarded_for, $remote_addr"，
    #      攻击者只要自带 `X-Forwarded-For: 127.0.0.1` 就能把首段伪造成
    #      回环地址，从而骗过应用层的「内网放行」判定 —— 等于白加。
    # -----------------------------------------------------------------------
    location /mcp {
        # 覆盖式设置，杜绝 XFF 伪造绕过
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        # MCP 请求体很小，收紧上限（应用侧相同上限为 4MB）
        client_max_body_size 8m;

        proxy_pass http://127.0.0.1:8021/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";      # 保持长连接
        proxy_buffering off;                        # SSE 必需
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;
        chunked_transfer_encoding on;
    }

    # -----------------------------------------------------------------------
    # REST API
    #   鉴权头 X-API-Key / Authorization 默认透传给上游，无需额外配置。
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 同样改为覆盖（与 /mcp 保持一致，防 XFF 伪造）
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 平台为单线程（受限容器），给足超时避免排队被误判为失败
        proxy_connect_timeout 30s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # 访问日志单独一份，便于排查且不污染现有站点日志
    access_log /var/log/nginx/skill-platform.access.log;
    error_log  /var/log/nginx/skill-platform.error.log;
}
