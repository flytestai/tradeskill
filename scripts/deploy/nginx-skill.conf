# ---------------------------------------------------------------------------
# 兜底 server：拒绝「Host 不在白名单内」的请求（2026-09-20 新增）
#
# 背景（实测）
#   原先主 server 的 server_name 结尾带 `_`。`_` 在 nginx 里是「无匹配时的兜底名」，
#   于是**任何域名只要解析到本机 IP，都会被接进主 server**：
#       curl -H 'Host: nonexistent.example.com' https://<ip>/healthz   -> 200
#   对照：MCP 端点因挂 SDK 的 DNS-rebinding 白名单，同样请求返回 421。
#   两者姿态不一致，REST 侧少一层纵深防御。
#
#   ⚠️ 这不等于「REST 没有鉴权」—— REST 靠 API Key 保护，无 Key 返回 401（已实测）。
#      Host 头从来不是鉴权手段。按 Host 收紧的价值：
#        · 减少扫描器 / 域名抢注者探测到有效响应
#        · 防止将来有人误加「按 Host 判断来源」的逻辑时留下缺口
#        · 与 MCP 侧防护姿态一致
#
# 为什么用 444（而非 421 / 403）
#   444 是 nginx 特有的「不发任何响应、直接关闭连接」。
#   对未知 Host 这是最干净的处置：不返回状态码、不返回 body、不泄露服务存在。
#   返回 421 反而明确告诉对方「这里有个 HTTP 服务」，多给了信息。
#
# ⚠️ 为什么不用 ssl_reject_handshake（更优雅）
#   那是 nginx 1.19.4+ 的能力，本机为 **nginx 1.18.0**，不支持，故用 444。
#
# ⚠️ 影响面
#   · 三个真实域名命中主 server，行为完全不变
#   · 证书续期走 80 端口的 acme-challenge location（在主 server 内），不受影响
#   · 80 端口块**保留** `_` + `return 404`（不改），避免未知域名落到 nginx 默认站点
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name _;

    # TLS 握手仍需证书；客户端不校验主体，因为我们随后即断开。
    #
    # ⚠️ 只写**最小集**，其余交给 options-ssl-nginx.conf（与主 443 块完全一致）。
    #    踩过的坑：我一度在这里又写了 ssl_session_timeout / ssl_session_cache /
    #    ssl_protocols 等，结果 nginx 报
    #        [emerg] "ssl_session_timeout" directive is duplicate
    #              in /etc/letsencrypt/options-ssl-nginx.conf:8
    #    因为该 include 文件本身就定义了这些指令。**不要重复声明**。
    ssl_certificate     /etc/letsencrypt/live/skill.flytest.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skill.flytest.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    return 444;
}

server {
    server_name skill.flytest.com.cn www.flytest.com.cn ai.flytest.com.cn;
    client_max_body_size 20m;
    # -----------------------------------------------------------------------
    # MCP 端点：streamable-http（2026-09-20 新增）
    #
    # ⚠️ 必须排在 `location /` **之前**。用 ^~ 显式声明「前缀匹配即停、不走正则」，
    #    意图明确，也防将来有人加正则 location 把它抢走。
    #
    # 上游：宿主 venv + systemd 的 kol-platform-mcp，仅监听 127.0.0.1:8021。
    #
    # 🔒 鉴权协作（配套 scripts/api/mcp_server.RequireAuthMiddleware）
    #   历史问题：该端点曾**完全不校验凭据**（无 Key / 伪造 Key 均 200），
    #   而同一服务的 REST 无 Key 返回 401 —— 一个服务两套标准。
    #
    #   · Nginx 侧：把 X-Forwarded-For **覆盖**为真实客户端 IP。
    #     ⚠️ 必须是「覆盖」，不能用 $proxy_add_x_forwarded_for「追加」：
    #        追加 = "$http_x_forwarded_for, $remote_addr"，
    #        攻击者只需自带 `X-Forwarded-For: 127.0.0.1` 就能把首段伪造成回环，
    #        从而骗过应用层的「内网放行」判定 —— 等于白加。
    #     已实测：自带 XFF:127.0.0.1 时，应用侧记录的真实 IP 仍是本机公网 IP。
    #   · 应用层：按 XFF 首段判定来源（PLATFORM_MCP_AUTH_MODE）
    #        warn    = 只记不拦（当前）
    #        enforce = 公网来源必须带有效 Key（本机/私网放行）
    #    因此这一行 Nginx 配置是 enforce 能生效的**前提**。
    #
    #   客户端传 Key：X-API-Key 或 Authorization: Bearer <key> 均可，
    #   两者都**原样透传**给上游（nginx 默认转发所有请求头，无需额外配置），
    #   应用侧 auth.extract_key() 两种都认。
    #   👉 开 enforce 前必须先把 Key 配到客户端（不带 Key 会被 401 打死）。
    #
    # ⚠️ DNS-rebinding 白名单（2026-09-20 实测踩坑）
    #   MCP SDK 默认 allowed_hosts 只有 127.0.0.1:* / localhost:* / [::1]:*，
    #   经反代时 Host 是真实域名 → 不匹配 → 直接 **421 Invalid Host header**。
    #   症状极具迷惑性：端口在听、本机 curl 200、日志正常，只有走真实域名才暴露。
    #   已在 scripts/api/mcp_server.py 把本域名加入白名单
    #   （可用 PLATFORM_MCP_ALLOWED_HOSTS 覆盖）。
    # -----------------------------------------------------------------------
    location ^~ /mcp {
        # 覆盖式设置，杜绝 XFF 伪造绕过
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        client_max_body_size 8m;        # MCP 请求体很小（应用侧上限 4MB）

        proxy_pass http://127.0.0.1:8021/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";      # 保持长连接

        # ⚠️ SSE 流式响应必需：缓冲会让客户端收不到分块数据、连接被挂起
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout   3600s;                 # MCP 长连接，勿按 REST 的 180s 设
        proxy_send_timeout   3600s;
        proxy_connect_timeout 30s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/skill.flytest.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/skill.flytest.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




    # -----------------------------------------------------------------------
    # 访问日志（2026-09-20 补回）
    #
    # ⚠️ 线上配置此前**没有** access_log 指令（重建时丢失），
    #    于是该站点的请求全部落到全局 /var/log/nginx/access.log，
    #    而 skill-platform.access.log 只剩重建前的 8 行陈数据 ——
    #    「日志看着有、其实是死的」，排查 MCP 调用方时会被彻底误导。
    #
    # ⚠️ 必须放在 **443 这个 server 块内、最后一个 location 之后**。
    #    生成时我先用 rfind('}') 定位，结果把它写进了后面那个只 `return 404`
    #    的 80 端口块里 —— 该块不处理真实请求，日志文件因此恒为 0 字节。
    #    「文件存在但永不写入」比「没有文件」更难发现，特此记录。
    #
    # ⚠️ 该日志由 /etc/logrotate.d/nginx 的 `/var/log/nginx/*.log` 覆盖
    #    （daily / rotate 14 / compress / create 0640 www-data adm）。
    #    它用 `create`（不是 copytruncate），而 Ubuntu 自带片段带
    #    postrotate → `invoke-rc.d nginx rotate`（发 USR1 让 nginx 重开日志），
    #    因此不会出现「继续往已归档文件里写、新文件恒为空」的问题，
    #    **无需**为本日志额外写 postrotate。
    #
    # 不记录请求头（含 API Key）—— 避免密钥落盘。使用默认 combined 格式。
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/skill-platform.access.log;
    error_log  /var/log/nginx/skill-platform.error.log warn;
}
server {
    if ($host = ai.flytest.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.flytest.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = skill.flytest.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name skill.flytest.com.cn www.flytest.com.cn ai.flytest.com.cn _;
    return 404; # managed by Certbot






}