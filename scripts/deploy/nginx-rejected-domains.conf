# ============================================================================
# 已下线域名 —— 显式拒绝
#
# 为什么需要这个文件：
#   nginx 中若某域名不匹配任何 server_name，请求会落到该端口上的
#   **default server**（这里是 cliproxy / flytest 主站）。
#   后果：访问已下线的旧域名会看到**无关服务的页面**，
#   既可能造成误解，也可能意外暴露其他服务。
#
#   实测：etf.flytest.com.cn 下线后
#         http  → 302 到 cliproxy 的 /management.html
#         https → 200 返回 flytest 主站
#
# 处理方式：显式 `return 444` —— nginx 关闭连接且不返回任何响应，
#          对客户端表现为「该域名无服务」，是最干净的离线信号。
#
# 安装位置：/etc/nginx/sites-available/rejected-domains
# 启用方式：ln -s /etc/nginx/sites-available/rejected-domains /etc/nginx/sites-enabled/
#
# 新增已下线域名：在 server_name 中追加即可。
# ============================================================================

# ---------------------------------------------------------------------------
# 80 端口
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name etf.flytest.com.cn;

    # 444：直接关闭连接，不返回任何内容
    return 444;
}

# ---------------------------------------------------------------------------
# 443 端口
#   说明：不指定 ssl_certificate，nginx 会用该端口的默认证书；
#   客户端可能看到证书不匹配告警，随后连接被关闭 —— 符合"域名已停用"的预期。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name etf.flytest.com.cn;

    return 444;
}
