# ============================================================================
# KOL Skills Platform —— Docker Compose 部署（完全隔离）
#
# 隔离保证（不触碰宿主机上已有的服务）：
#   1. 独立项目名 kolplatform → 资源前缀 kolplatform_*，与 flytest_* 无交集
#   2. 端口用 8020/8021（宿主已占用：22/80/443/1455/8010/8085/8317/8912/11451/51121/54545）
#   3. 只绑定 127.0.0.1 —— 不对外暴露，跨机访问请自行加 Nginx 反代
#   4. 独立数据卷 kolplatform_data，不碰 /opt/flytest 及任何现有目录
#   5. 不改动宿主 Python/系统包 —— 一切依赖都在镜像内
#
# 用法（在解包后的部署目录内）：
#   docker-compose -p kolplatform up -d --build        # 构建并启动
#   docker-compose -p kolplatform ps                   # 查看状态
#   docker-compose -p kolplatform logs -f              # 查看日志
#   docker-compose -p kolplatform down                 # 停止并移除容器（保留数据卷）
#   docker-compose -p kolplatform down -v              # 连数据卷一起移除（彻底清理）
# ============================================================================
version: "3.7"

services:
  # --------------------------------------------------------------------------
  # REST 接口服务（轻量，仅需 flask）
  # --------------------------------------------------------------------------
  rest:
    build:
      context: ../..
      dockerfile: scripts/deploy/Dockerfile
      args:
        INSTALL_MCP: "0"
    image: kol-skills-platform:latest
    container_name: kolplatform-rest
    command: ["python", "-m", "api.rest_app"]
    restart: unless-stopped

    # 仅监听宿主本机，绝不对外暴露
    ports:
      - "127.0.0.1:8020:8000"

    environment:
      TZ: Asia/Shanghai
      PLATFORM_HOST: 0.0.0.0          # 容器内监听；对外由宿主端口绑定限制为 127.0.0.1
      PLATFORM_PORT: "8000"
      # 数据源通道：http=蜜蜂网关 / local=公开行情源（彻底剥离蜜蜂时改 local）
      BEE_CHANNEL: "${BEE_CHANNEL:-http}"
      BEE_FALLBACK_LOCAL: "${BEE_FALLBACK_LOCAL:-0}"
      # 鉴权（从宿主 .env 注入；留空则不校验，仅限本机绑定场景）
      PLATFORM_API_KEYS: "${PLATFORM_API_KEYS:-}"
      # 飞书标识（可选）
      WU2198_CHAT_ID: "${WU2198_CHAT_ID:-}"
      USER_OPEN_ID: "${USER_OPEN_ID:-}"

    volumes:
      # ⚠️ 用 bind mount 挂宿主 data 目录（而非 Docker 卷）：
      #    宿主机脚本（同步/播报）与容器必须共享同一份数据。
      #    用卷会产生两份互不可见的数据（已实测踩坑）。
      - ../../data:/app/data
      - ../../sync:/app/sync

    # 资源限制（宿主仅 2 核 / 980MB，需克制）
    mem_limit: 320m
    cpus: 0.8
    memswap_limit: 700m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=10).status==200 else 1)"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3

  # --------------------------------------------------------------------------
  # MCP 接口服务（供蜜蜂 / WorkBuddy / 任意 MCP Agent 调用）
  #
  # 默认不启动（profiles: mcp），因为需要 pip install mcp（镜像体积 +~150MB）。
  # 启用方式：
  #   docker-compose -p kolplatform --profile mcp up -d --build
  # --------------------------------------------------------------------------
  mcp:
    build:
      context: ../..
      dockerfile: scripts/deploy/Dockerfile
      args:
        INSTALL_MCP: "1"
    image: kol-skills-platform:mcp
    container_name: kolplatform-mcp
    command: ["python", "-m", "api.mcp_server", "--http", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    profiles: ["mcp"]

    ports:
      - "127.0.0.1:8021:8000"

    environment:
      TZ: Asia/Shanghai
      PLATFORM_HOST: 0.0.0.0
      PLATFORM_PORT: "8000"
      PLATFORM_MCP_PORT: "8000"
      BEE_CHANNEL: "${BEE_CHANNEL:-http}"
      BEE_FALLBACK_LOCAL: "${BEE_FALLBACK_LOCAL:-0}"
      PLATFORM_API_KEYS: "${PLATFORM_API_KEYS:-}"

    volumes:
      - ../../data:/app/data:ro
      - ../../sync:/app/sync

    mem_limit: 400m
    cpus: 0.8
    memswap_limit: 800m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 注：不再使用 Docker 卷 —— 数据以 bind mount 方式挂宿主 data/ 目录，
#     以便宿主机脚本（同步/播报）与容器 API 共享同一份数据。
